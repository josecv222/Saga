[package]
name = "saga"
version = "1.0.2"
description = "Saga — biblioteca y lector de libros"
edition = "2021"
build = "build.rs"

[[bin]]
name = "Saga"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl", "std"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rustybuzz = "0.20"
swash = "0.2"
hypher = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
hayro = "0.9"
unrar = "0.5"
sevenz-rust2 = { version = "0.26", default-features = false }
djvu-rs = { version = "1.0.0-rc.1" }
rayon = "1"
parking_lot = "0.12"
encoding_rs = "0.8"
chardetng = "0.1"
arboard = { version = "3", default-features = false }
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Media_SpeechSynthesis", "Media_Playback", "Media_Core", "Storage_Streams", "Foundation", "Foundation_Collections"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
